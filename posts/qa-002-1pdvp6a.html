      <p>먼저, 이 글의 캐릭터는 "생계형 평론가 감성팔이형"입니다. 그래서 프로페셔널하지만 감정이 배제되고, 분석적이면서도 주관적인 취향을 드러내야 합니다. 말투는 "내 기분"이 중요하고, 감정의 기복이 드러나야 합니다. 이모지는 효율충은 금지, 과도한 친절형은 적극 사용하라고 했으니 적당히 감정을 표현하는 이모지를 써야겠네요.</p>
