<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="74" cy="567" r="60" fill="#16213e" opacity="0.08"/>
    <circle cx="242" cy="588" r="75" fill="#16213e" opacity="0.19"/>
    <circle cx="391" cy="83" r="43" fill="#16213e" opacity="0.17"/>
    <circle cx="337" cy="390" r="42" fill="#16213e" opacity="0.06"/>
    <circle cx="1250" cy="578" r="88" fill="#16213e" opacity="0.07"/>
    <circle cx="412" cy="521" r="22" fill="#16213e" opacity="0.06"/>
    <rect x="-35" y="93" width="26" height="72" rx="8" fill="#1a1a2e" opacity="0.06" transform="rotate(25, 973, 465)"/>
    <rect x="-40" y="356" width="88" height="90" rx="8" fill="#1a1a2e" opacity="0.04" transform="rotate(1, 427, 62)"/>
    <rect x="1295" y="316" width="81" height="48" rx="8" fill="#1a1a2e" opacity="0.13" transform="rotate(20, 210, 53)"/>
    <rect x="1231" y="67" width="89" height="27" rx="8" fill="#1a1a2e" opacity="0.14" transform="rotate(36, 1108, 673)"/>
    <rect x="581" y="494" width="63" height="42" rx="8" fill="#1a1a2e" opacity="0.06" transform="rotate(38, 477, -75)"/>
    <rect x="531" y="122" width="60" height="26" rx="8" fill="#1a1a2e" opacity="0.07" transform="rotate(24, 645, 53)"/>
    <rect x="366" y="360" width="49" height="43" rx="8" fill="#1a1a2e" opacity="0.04" transform="rotate(6, 6, 538)"/>
    <rect x="33" y="616" width="43" height="74" rx="8" fill="#1a1a2e" opacity="0.04" transform="rotate(0, 937, 82)"/>
    <polygon points="1120,-7 1201,155 1039,155" fill="#16213e" opacity="0.12"/>
    <polygon points="1238,658 1292,766 1184,766" fill="#16213e" opacity="0.04"/>
    <polygon points="68,344 119,446 17,446" fill="#16213e" opacity="0.07"/>
    <polygon points="933,260 1002,398 864,398" fill="#16213e" opacity="0.10"/>

  <!-- Wave at bottom -->
  <path d="M0,542 C360,586 840,498 1200,542 L1200,630 L0,630Z" fill="#16213e" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    마곡 클럽 추천정보
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마곡 — 클럽
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#e94560" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#e94560" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마곡 마곡 클럽 추천정보 — 클럽
  </text>
</svg>